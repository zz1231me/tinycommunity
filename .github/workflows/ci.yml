name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  server:
    name: Server (TypeScript + ESLint + Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Run tests with coverage
        run: npm test -- --coverage
        env:
          # 스위트 108개를 한 프로세스에서(--runInBand) 커버리지까지 켜고 돌린다.
          # 기본 힙(약 4GB)에 닿아 OOM 으로 멈췄다 — 로컬에서 같은 조건으로 재니
          # 4GB 바로 아래였다. 여유를 준다.
          NODE_OPTIONS: --max-old-space-size=6144
          NODE_ENV: test
          DB_TYPE: sqlite
          DB_STORAGE: ':memory:'
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-test-jwt-secret-key-at-least-32-chars' }}
          JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET || 'ci-test-refresh-secret-key-32-chars' }}
          ADMIN_DEFAULT_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD || 'CiTestAdmin123!' }}

  client:
    name: Client (TypeScript + ESLint + Tests + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
