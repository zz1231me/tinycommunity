# TinyCommunity nginx 설정 — Express(API + SSR 진입점) 앞단
#
# ══════════════════════════════════════════════════════════════════════════
# 고칠 곳은 딱 두 군데다
#   1) upstream app_server   … 백엔드 주소        (아래 http 블록)
#   2) set $project_root     … 프로젝트 절대경로  (아래 server 블록)
#   나머지는 건드리지 않아도 된다.
# ══════════════════════════════════════════════════════════════════════════
#
# ── 이 파일을 어디에 두는가 ────────────────────────────────────────────────
#  Windows : C:/nginx/conf/nginx.conf 를 이 파일로 통째로 교체
#  Linux   : /etc/nginx/nginx.conf 를 이 파일로 통째로 교체
#
#  ⚠️ Linux(데비안·우분투)에서 이 파일을 conf.d/ 나 sites-available/ 에 통째로 넣으면
#     기동이 막힌다. 그 폴더들은 이미 열려 있는 http 블록 *안에* include 되는 자리라
#     worker_processes·events·http 를 다시 적을 수 없기 때문이다. 실제로 이렇게 뜬다:
#       nginx: [emerg] "worker_processes" directive is not allowed here
#
#     그쪽에 넣으려면 아래 server { ... } 블록만 잘라 넣고, upstream·map·
#     limit_req_zone·limit_req_status 는 배포판 nginx.conf 의 http 블록으로 옮긴다.
#     server 블록만 옮기고 upstream 을 두고 오면 이렇게 뜬다:
#       nginx: [emerg] host not found in upstream "app_server"
#
# ── 적용 ──────────────────────────────────────────────────────────────────
#  Windows : cd C:/nginx  →  nginx -t  →  nginx -s reload   (최초 실행은 start nginx)
#  Linux   : sudo nginx -t  →  sudo systemctl reload nginx
#  두 환경 모두 고치고 나면 반드시 nginx -t 로 먼저 문법을 확인한다.
#
# ── 전제 ──────────────────────────────────────────────────────────────────
#  · Express 가 NODE_ENV=production 으로 떠 있어야 한다(HTML 진입점을 Express 가 준다).
#  · client 를 빌드해 client/dist 가 있어야 한다.
#
# ── Linux 에서만 걸리는 것들 ───────────────────────────────────────────────
#  · 권한: 워커가 nginx/www-data 로 돌기 때문에 $project_root 아래 파일을 읽을 수
#    있어야 한다. 못 읽으면 정적 파일이 403 으로 나온다(설정이 아니라 권한 문제다).
#      sudo chown -R $USER:www-data /srv/tinycommunity
#      sudo chmod -R a+rX /srv/tinycommunity/client/dist /srv/tinycommunity/server/uploads
#    홈 디렉터리(/home/사용자/...) 아래에 두면 상위 폴더에 x 권한이 없어 막히는 일이
#    잦다. /srv 나 /opt 처럼 열려 있는 곳을 쓰는 편이 편하다.
#  · SELinux(RHEL·Rocky·Fedora): 켜져 있으면 proxy_pass 가 (13: Permission denied) 로
#    막힌다. 아래 한 번만 실행하면 된다.
#      sudo setsebool -P httpd_can_network_connect 1
#      sudo semanage fcontext -a -t httpd_sys_content_t "/srv/tinycommunity(/.*)?"
#      sudo restorecon -Rv /srv/tinycommunity
#  · 80 포트는 root 권한이 필요하다. systemd 로 띄우면 알아서 처리된다.
#  · 파일 이름 대소문자를 가린다. Windows 에서 되던 Logo.PNG 참조가 리눅스에서
#    깨질 수 있다.
#
# ── Windows 에서만 걸리는 것들 ─────────────────────────────────────────────
#  · 경로에 역슬래시(\)를 쓰면 안 된다. C:/myproject 처럼 정슬래시로 적는다.
#  · user 지시어는 Windows 에서 무시된다(그래서 이 파일에도 없다).
#  · worker_processes auto 를 적어도 실제로 일하는 워커는 하나다(nginx/Windows 제약).
#    로컬·소규모 사내용에는 문제되지 않는다.

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    sendfile        on;
    keepalive_timeout  65;

    # ========================================
    # ⭐ 고칠 곳 (1/2) — 백엔드 주소
    #    여기 한 줄만 고치면 아래 proxy_pass 7곳이 모두 따라간다.
    #
    #    같은 장비에서 Express 를 직접 실행  : server 127.0.0.1:4000;
    #    Docker Compose 로 함께 띄움          : server app:4000;   (서비스 이름)
    #      ※ 컨테이너 안에서 127.0.0.1 은 그 컨테이너 자신을 가리킨다.
    #         nginx 를 컨테이너로 띄웠다면 반드시 서비스 이름으로 바꿔야 한다.
    #    다른 장비                            : server 10.0.0.5:4000;
    # ========================================
    upstream app_server {
        server 127.0.0.1:4000;
    }

    # 관리자 설정(사이트 설정 › 최대 파일 크기)의 상한과 맞춰 둔다.
    # 여기가 더 작으면 관리자가 한도를 올려도 그 사이 크기는 Express 에 닿기도 전에
    # nginx 가 413 으로 끊는다 — 앱의 안내 문구 대신 nginx 기본 오류 화면이 뜬다.
    client_max_body_size 1000m;

    # ========================================
    # gzip 압축
    # ========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # ========================================
    # 요청 제한 설정
    # ========================================
    limit_req_zone $binary_remote_addr zone=general:10m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=400r/m;
    limit_req_zone $binary_remote_addr zone=login:10m   rate=30r/m;

    # rate limit 초과 시 503 대신 올바른 429 반환
    limit_req_status 429;

    # ========================================
    # CORS Origin 안전 처리
    # ========================================
    map $http_origin $cors_origin {
        default  '';
        ~^https?://.+  $http_origin;
    }

    # 메인 서버 블록
    server {
        listen       80;
        server_name  localhost;

        # ========================================
        # ⭐ 고칠 곳 (2/2) — 프로젝트 절대경로
        #    여기 한 줄만 고치면 아래 root 3곳이 모두 따라간다
        #    (아바타 · 클라이언트 정적파일 · 에러 페이지).
        #
        #    가리켜야 하는 곳은 client/ 와 server/ 의 *상위* 폴더다.
        #      <project_root>/client/dist/...      ← 빌드 결과물
        #      <project_root>/server/uploads/...   ← 업로드 폴더
        #
        #    Windows : set $project_root  C:/myproject;        (정슬래시!)
        #    Linux   : set $project_root  /srv/tinycommunity;
        # ========================================
        set $project_root  C:/myproject;

        # ========================================
        # IP 제한 — 사내망에서만 열어 둔다
        #
        # ⚠️ 사설망 대역만 허용하므로, 외부(집·클라우드)에서 열면 403 이 뜬다.
        #    공개 서비스로 쓸 거면 이 네 줄을 통째로 지운다.
        #    nginx 앞에 로드밸런서·CDN 이 있으면 $remote_addr 가 그 장비 주소라
        #    이 목록이 무의미해진다 — 그때는 real_ip 모듈 설정이 따로 필요하다.
        # ========================================
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;

        # ========================================
        # 막혔을 때 무엇을 보여 줄 것인가
        #
        # API 요청과 사람이 연 화면은 원하는 게 다르다. 예전에는 둘 다 날 JSON 을 받아서,
        # 주소창으로 들어온 사람에게 {"success":false,...} 가 그대로 보였다.
        # 사람에게는 아래 HTML 을, /api/ 요청에는 그 location 안에 둔 JSON 을 준다.
        # ========================================
        error_page 429 /429.html;
        location = /429.html {
            root $project_root/client/dist;
            internal;
        }

        error_page 503 /503.html;
        location = /503.html {
            root $project_root/client/dist;
            internal;
        }

        # ── API 용 JSON 응답 (아래 location ^~ /api/ 안에서 참조한다) ──
        location @cors_429 {
            default_type application/json;
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'       always;
            add_header 'Vary'                             'Origin'     always;
            return 429 '{"success":false,"message":"요청이 너무 많습니다. 잠시 후 다시 시도해주세요."}';
        }

        location @cors_503 {
            default_type application/json;
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'       always;
            add_header 'Vary'                             'Origin'     always;
            return 503 '{"success":false,"message":"서버가 일시적으로 과부하 상태입니다. 잠시 후 다시 시도해주세요."}';
        }

        # ========================================
        # 업로드 파일 처리
        #
        # ⚠️ 인가 모델은 Express(server/src/index.ts)와 반드시 일치해야 한다.
        #    - uploads/images  : Express 가 authenticate 를 거쳐 서빙 → 여기서도 프록시(정적 서빙 금지)
        #    - uploads/avatars : 공개(로그인 화면 등에서도 필요) → 정적 서빙 가능
        #    - 그 외(files·thumbs·temp·custom-pages) : 정적 서빙하면 게시판 읽기 권한/비밀글
        #      검증을 통째로 우회한다(IDOR). 반드시 /api/uploads/... 인가 라우트로만 제공한다.
        # ========================================

        # 아바타: 인증 없이 공개 (Express 도 동일)
        location ^~ /uploads/avatars/ {
            root $project_root/server;

            expires 1y;
            add_header Cache-Control        "public, immutable";
            add_header Content-Disposition  "inline";
            add_header X-Content-Type-Options "nosniff";
        }

        # 본문 인라인 이미지: Express 가 authenticate 후 서빙하므로 정적으로 내보내지 않고 프록시한다.
        # (정적 서빙하면 로그인하지 않은 사람도 파일명만 알면 볼 수 있다)
        location ^~ /uploads/images/ {
            proxy_pass http://app_server;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 첨부파일·썸네일·임시공유·번들은 정적 경로로 노출하지 않는다.
        # 클라이언트는 /api/uploads/download/:filename, /api/uploads/thumb/:filename,
        # /api/temp-share/:token, /api/custom-pages/:slug/bundle 을 사용한다.
        location /uploads/ {
            return 404;
        }

        # ========================================
        # 로그인 API — 엄격한 rate limit
        # ========================================
        location = /api/auth/login {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age'           '600'  always;
                add_header 'Vary'                             'Origin' always;
                return 204;
            }

            limit_req zone=login burst=3 nodelay;

            proxy_pass http://app_server/api/auth/login;
            proxy_set_header Host              $host;
            proxy_set_header Origin            $http_origin;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========================================
        # 토큰 갱신 API
        # ========================================
        location = /api/auth/refresh {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin always;
                add_header 'Access-Control-Allow-Methods'     'POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age'           '600'  always;
                add_header 'Vary'                             'Origin' always;
                return 204;
            }

            limit_req zone=api burst=10 nodelay;

            proxy_pass http://app_server/api/auth/refresh;
            proxy_set_header Host              $host;
            proxy_set_header Origin            $http_origin;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========================================
        # 관리자 API
        # ========================================
        # ^~ : 아래 확장자 정규식 location 이 /api/ 경로를 가로채지 못하게 한다.
        location ^~ /api/admin/ {
            error_page 429 @cors_429;
            error_page 503 @cors_503;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age'           '600'  always;
                add_header 'Vary'                             'Origin' always;
                return 204;
            }

            limit_req zone=api burst=15 nodelay;

            proxy_pass http://app_server/api/admin/;
            proxy_set_header Host              $host;
            proxy_set_header Origin            $http_origin;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========================================
        # SSE 실시간 알림 스트림
        # 응답이 열린 채로 유지되므로 버퍼링을 끄고 타임아웃을 길게 잡는다.
        # (일반 /api/ 블록에 두면 버퍼링 때문에 이벤트가 즉시 전달되지 않고,
        #  기본 read timeout 에 걸려 주기적으로 끊긴다)
        # ========================================
        location = /api/notifications/stream {
            proxy_pass http://app_server/api/notifications/stream;
            proxy_set_header Host              $host;
            proxy_set_header Origin            $http_origin;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 1h;
        }

        # ========================================
        # 일반 API 프록시
        # ========================================
        # ^~ : 아래 확장자 정규식 location 보다 먼저 확정된다.
        # 이게 없으면 /api/custom-pages/:slug/bundle/app.js 같은 API 응답이
        # 정규식에 걸려 client/dist 에서 찾아지고(없으니 404), 번들 페이지의
        # 스크립트·스타일이 통째로 깨진다.
        location ^~ /api/ {
            # API 를 부른 쪽은 화면이 아니라 프로그램이다 — HTML 대신 JSON 을 준다.
            error_page 429 @cors_429;
            error_page 503 @cors_503;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age'           '600'  always;
                add_header 'Vary'                             'Origin' always;
                return 204;
            }

            limit_req zone=api burst=30 nodelay;

            proxy_pass http://app_server/api/;
            proxy_set_header Host              $host;
            proxy_set_header Origin            $http_origin;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========================================
        # 클라이언트 정적 파일 (폰트/CSS/JS 캐싱)
        # ========================================
        location ~* ^(?!/uploads/).*\.(css|js|woff|woff2|ttf|eot)$ {
            root   $project_root/client/dist;
            
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
        }

        # ========================================
        # React SPA (HTML 진입점은 Express로 프록시 → OG/타이틀 메타 주입)
        # ========================================
        # ⚠️ index.html을 Nginx가 정적으로 직접 주면, 링크 미리보기 크롤러(카카오톡·구글 등)는
        #   JS를 실행하지 않으므로 빌드 시점에 고정된 기본 메타만 읽는다
        #   → 관리자가 사이트 설정(이름/타이틀/설명)을 바꿔도 미리보기에 반영되지 않음.
        #   Express는 응답 시점에 현재 사이트 설정을 OG/타이틀 메타에 주입(renderIndexHtml)하므로,
        #   HTML 문서 요청을 Express로 프록시한다. 해시된 정적 자산(css/js/폰트)은 위 정규식
        #   location 블록이 그대로 Nginx에서 직접 서빙하므로 성능 영향은 사실상 없다.
        #   (전제: Express가 NODE_ENV=production 으로 실행되고 client/dist가 존재해야 함)
        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass http://app_server;
            proxy_set_header Host              $host;
            proxy_set_header Origin            $http_origin;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========================================
        # 에러 페이지
        # ========================================
        error_page 500 501 502 504 /50x.html;
        location = /50x.html {
            root $project_root/client/dist;
            internal;
        }

        error_page 400 401 402 403 404 /index.html;

    } # server 블록 종료
} # http 블록 종료
